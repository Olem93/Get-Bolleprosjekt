<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nettside111</title>
    <style>

        body {

            background-color: hsl(0, 0%, 100%);
            background-image: url("boller2.jpg");

            background-size: cover;
            background-attachment:fixed;

        }

        .header-logo-img {
            height: 100%;
            width: 100%;

        }       

        #Overskrift2 {

            font-style: italic;
            font-weight: 50;
            font-size: 40px;    
            text-align: center;

        .Listetekst {
            color: hsl(0, 0%, 0%);
            font-style: italic;
            font-weight: 80;
            font-size: 30px;

        }   
        
        .Listetekst2 {
            text-align: center;
            color: hsl(0, 0%, 0%);
            font-weight: 20;

            text-align: center;
            color: hsl(0, 0%, 0%);

            text-align: center;
            color: hsl(0, 0%, 0%);

        #TitleText {

            font-family: Georgia, 'Times New Roman', Times, serif;   
            font-weight: 10;
            font-size: 30px;

        .bolle-img {
            min-width: 300px;
            max-width: 400px;
            height:auto;
            border: 2px solid black;
            margin: 1% 1%;
        }

        .primarycontent {
            background-color: hsl(59, 23%, 63%);
            min-width: 720px;
            max-width: 2560px;
            padding: 20px;
            margin: 1% 1%;
        }     
        
        .primarycontent2 {

        }      

        #Buybutton {
            background-color: rgb(227, 228, 197);
            padding: 3px;
            border: 2px solid;
            border-radius: 15%;
        }

</head>

<body>

       </div>
